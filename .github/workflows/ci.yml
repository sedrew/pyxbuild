name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.11", "3.14"]
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,stubs]"
      - run: ruff check .
      - run: python -m pytest -m "not slow" -ra

  stubs:
    name: launcher stubs are reproducible (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ziglang==0.16.0
      - run: python tools/build_stubs.py --check

  build-golden:
    name: build golden apps on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python tools/golden.py build --out golden-out
      - uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.os }}
          path: golden-out
          retention-days: 7

  reproducibility:
    name: identical output on every build host
    needs: build-golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: compare SHA256SUMS
        run: |
          status=0
          for host in macos-14 windows-latest; do
            echo "== ubuntu-latest vs $host"
            for f in artifacts/golden-ubuntu-latest/*.files.txt; do
              diff "$f" "artifacts/golden-$host/$(basename "$f")" > /dev/null || {
                echo "-- $(basename "$f"): files that differ"
                diff "$f" "artifacts/golden-$host/$(basename "$f")" | head -20
                status=1
              }
            done
            diff artifacts/golden-ubuntu-latest/SHA256SUMS "artifacts/golden-$host/SHA256SUMS" || status=1
          done
          exit $status

  run-on-windows:
    name: run apps built on ${{ matrix.built-on }} on windows-latest
    needs: build-golden
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        built-on: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: golden-${{ matrix.built-on }}
          path: golden-out
      - name: run with no Python on PATH
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch 'Python|pipx|hostedtoolcache' }) -join ';'
          if (Get-Command python -ErrorAction SilentlyContinue) { Write-Host "note: a python is still on PATH" }
          & $py tools/golden.py run golden-out

  compare-with-pip:
    name: same files as pip install (py${{ matrix.python }})
    needs: build-golden
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install packaging installer
      - uses: actions/download-artifact@v4
        with:
          name: golden-macos-14
          path: golden-out
      - run: python tools/compare_with_pip.py golden-out/level1-py${{ matrix.python }}.zip golden-out/level1-py${{ matrix.python }}.pylock.toml
      - run: python tools/compare_with_pip.py golden-out/level2-py${{ matrix.python }}.zip golden-out/level2-py${{ matrix.python }}.pylock.toml "*.pyi"

  e2e:
    name: e2e on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: install Wine and osslsigncode
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq osslsigncode
          eval "$(tools/get_wine.sh)"
          echo "PYXBUILD_WINE=$PYXBUILD_WINE" >> "$GITHUB_ENV"
      - run: python -m pytest -m "slow and not golden" -ra

  apps-build:
    # macos-14 is ARM64: those builds are ARM64 -> Windows x86_64 cross builds
    name: build real applications on ${{ matrix.os }} (${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        group: [web, data, cli, docs-ui, cross]
        include:
          - group: web
            apps: django,flask,fastapi,datasette,wagtail,gradio
          - group: data
            apps: streamlit,jupyterlab,scrapy,locust
          - group: cli
            apps: httpie,black,ruff,yt-dlp,poetry,virtualenv,ansible
          - group: docs-ui
            apps: mkdocs-material,sphinx,textual,pygame,kivy
          - group: cross
            apps: zig-cross
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[cross]"
      - run: python tools/apps_matrix.py --apps ${{ matrix.apps }} --build-only --keep apps-out --jobs 3
      - uses: actions/upload-artifact@v4
        with:
          name: apps-${{ matrix.os }}-${{ matrix.group }}
          path: apps-out
          # upload-artifact skips dot files by default; mkdocs-material needs
          # material/templates/.icons
          include-hidden-files: true
          retention-days: 3

  apps-run:
    name: run apps built on ${{ matrix.built-on }} on windows-latest (${{ matrix.group }})
    needs: apps-build
    runs-on: windows-latest
    # upstream releases change under us; the table in the job summary is the result
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        built-on: [ubuntu-latest, macos-14]
        group: [web, data, cli, docs-ui, cross]
        include:
          - group: web
            apps: django,flask,fastapi,datasette,wagtail,gradio
          - group: data
            apps: streamlit,jupyterlab,scrapy,locust
          - group: cli
            apps: httpie,black,ruff,yt-dlp,poetry,virtualenv,ansible
          - group: docs-ui
            apps: mkdocs-material,sphinx,textual,pygame,kivy
          - group: cross
            apps: zig-cross
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: apps-${{ matrix.built-on }}-${{ matrix.group }}
          path: apps-out
      - name: run
        shell: pwsh
        run: |
          python tools/apps_matrix.py --apps ${{ matrix.apps }} --run-from apps-out --jobs 2 --built-on "${{ matrix.built-on }}" --out apps.md --json apps.json
          $code = $LASTEXITCODE
          Get-Content apps.md | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apps-result-${{ matrix.built-on }}-${{ matrix.group }}
          path: apps.*

  bench:
    name: benchmark vs PyInstaller (${{ matrix.project }}, windows-latest)
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        project: [hello, level1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python tools/bench.py --project ${{ matrix.project }} --runs 7 --pyinstaller --json bench-${{ matrix.project }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.project }}
          path: bench-${{ matrix.project }}.json
