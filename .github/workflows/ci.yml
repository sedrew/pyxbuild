name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.11", "3.14"]
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,stubs]"
      - run: ruff check .
      - run: python -m pytest -m "not slow" -ra

  stubs:
    name: launcher stubs are reproducible (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ziglang==0.16.0
      - run: python tools/build_stubs.py --check

  action:
    name: GitHub Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - id: pyx
        uses: ./
        with:
          project: tests/golden/hello
          args: --mode onefile
          artifact-name: action-hello-${{ matrix.os }}
      - name: the executable is there
        shell: bash
        run: test -s "${{ steps.pyx.outputs.dist }}/hello.exe"
      - name: the executable runs
        if: runner.os == 'Windows'
        shell: bash
        run: '"${{ steps.pyx.outputs.dist }}/hello.exe"'

  sandbox:
    name: browser sandbox (Pyodide in headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e . "mkdocs<2" "mkdocs-material<10"
      - name: build the site (Python 3.12 runtime only)
        run: python tools/build_site.py --runtimes 3.12
      - name: record the PyPI slice the example needs
        run: python tools/web_mirror.py record build/mirror rich
      - name: build in the browser
        run: |
          python tools/web_mirror.py serve build/mirror --port 8765 &
          mkdir -p "$RUNNER_TEMP/e2e" && cp tools/web_e2e.mjs "$RUNNER_TEMP/e2e/"
          cd "$RUNNER_TEMP/e2e" && npm init -y >/dev/null && npm i --no-save playwright-core@1.55.0
          CHROMIUM="$(command -v google-chrome)" node web_e2e.mjs http://127.0.0.1:8765/ "$GITHUB_WORKSPACE/hello-web.exe"
          head -c 2 "$GITHUB_WORKSPACE/hello-web.exe" | grep -q MZ
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-exe
          path: hello-web.exe

  sandbox-run:
    name: run the browser-built exe on windows-latest
    needs: sandbox
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sandbox-exe
      - shell: bash
        run: |
          out="$(echo | ./hello-web.exe)"
          echo "$out"
          echo "$out" | grep -q "Built in the browser with pyxbuild"

  linux-build:
    name: build Linux apps on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: build hello for both Linux targets (folder .tar.gz and onefile)
        shell: bash
        run: |
          for t in linux_x86_64 linux_aarch64; do
            # --out is relative to the project, so pass an absolute path
            python -m pyxbuild build tests/golden/hello --target $t --zip --out "$PWD/out/$t"
            python -m pyxbuild build tests/golden/hello --target $t --mode onefile --out "$PWD/out/$t-onefile"
            rm -rf "out/$t/hello-$t"   # the folder is in the .tar.gz
          done
          python - <<'PY'
          import hashlib, pathlib
          out = pathlib.Path("out")
          lines = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(out).as_posix()}"
                   for p in sorted(out.rglob("*")) if p.is_file()]
          (out / "SHA256SUMS").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.os }}
          path: out
          retention-days: 7

  linux-reproducible:
    name: identical Linux apps on every build host
    needs: linux-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          diff artifacts/linux-ubuntu-latest/SHA256SUMS artifacts/linux-macos-14/SHA256SUMS
          diff artifacts/linux-ubuntu-latest/SHA256SUMS artifacts/linux-windows-latest/SHA256SUMS

  linux-run:
    name: run Linux apps built on ${{ matrix.built-on }} (${{ matrix.runner }})
    needs: linux-build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        built-on: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.built-on }}
          path: app
      - name: folder and onefile start without a system Python
        run: |
          t=linux_x86_64; [ "$(uname -m)" = aarch64 ] && t=linux_aarch64
          tar xzf "app/$t/hello-1.0.0-$t.tar.gz"
          env -i PATH=/usr/bin:/bin HOME="$HOME" "./hello-$t/hello" | tee out.txt
          grep -q "requests" out.txt
          chmod +x "app/$t-onefile/hello"   # artifacts do not keep modes
          env -i PATH=/usr/bin:/bin HOME="$HOME" "app/$t-onefile/hello" | tee out2.txt
          grep -q "requests" out2.txt

  linux-e2e:
    name: Linux end to end (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_linux.py -ra

  build-golden:
    name: build golden apps on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python tools/golden.py build --out golden-out
      - uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.os }}
          path: golden-out
          retention-days: 7

  reproducibility:
    name: identical output on every build host
    needs: build-golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: compare SHA256SUMS
        run: |
          status=0
          for host in macos-14 windows-latest; do
            echo "== ubuntu-latest vs $host"
            for f in artifacts/golden-ubuntu-latest/*.files.txt; do
              diff "$f" "artifacts/golden-$host/$(basename "$f")" > /dev/null || {
                echo "-- $(basename "$f"): files that differ"
                diff "$f" "artifacts/golden-$host/$(basename "$f")" | head -20
                status=1
              }
            done
            diff artifacts/golden-ubuntu-latest/SHA256SUMS "artifacts/golden-$host/SHA256SUMS" || status=1
          done
          exit $status

  run-on-windows:
    name: run apps built on ${{ matrix.built-on }} on windows-latest
    needs: build-golden
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        built-on: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: golden-${{ matrix.built-on }}
          path: golden-out
      - name: run with no Python on PATH
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch 'Python|pipx|hostedtoolcache' }) -join ';'
          if (Get-Command python -ErrorAction SilentlyContinue) { Write-Host "note: a python is still on PATH" }
          & $py tools/golden.py run golden-out

  compare-with-pip:
    name: same files as pip install (py${{ matrix.python }})
    needs: build-golden
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install packaging installer
      - uses: actions/download-artifact@v4
        with:
          name: golden-macos-14
          path: golden-out
      - run: python tools/compare_with_pip.py golden-out/level1-py${{ matrix.python }}.zip golden-out/level1-py${{ matrix.python }}.pylock.toml
      - run: python tools/compare_with_pip.py golden-out/level2-py${{ matrix.python }}.zip golden-out/level2-py${{ matrix.python }}.pylock.toml "*.pyi"

  e2e:
    name: e2e on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: install Wine and osslsigncode
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -yq osslsigncode
          eval "$(tools/get_wine.sh)"
          echo "PYXBUILD_WINE=$PYXBUILD_WINE" >> "$GITHUB_ENV"
      - run: python -m pytest -m "slow and not golden" -ra

  apps-build:
    # macos-14 is ARM64: those builds are ARM64 -> Windows x86_64 cross builds
    name: build real applications on ${{ matrix.os }} (${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        group: [web, data, cli, docs-ui, cross]
        include:
          - group: web
            apps: django,flask,fastapi,datasette,wagtail,gradio
          - group: data
            apps: streamlit,jupyterlab,scrapy,locust
          - group: cli
            apps: httpie,black,ruff,yt-dlp,poetry,virtualenv,ansible
          - group: docs-ui
            apps: mkdocs-material,sphinx,textual,pygame,kivy
          - group: cross
            apps: zig-cross
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[cross]"
      - run: python tools/apps_matrix.py --apps ${{ matrix.apps }} --build-only --archive --keep apps-out --jobs 3
      - uses: actions/upload-artifact@v4
        with:
          name: apps-${{ matrix.os }}-${{ matrix.group }}
          path: apps-out
          # one pyxbuild zip per app (--archive): an artifact of 33 000 small
          # files failed to download on Windows; and upload-artifact skips dot
          # files (mkdocs-material's .icons) unless told otherwise
          include-hidden-files: true
          retention-days: 3

  apps-run:
    name: run apps built on ${{ matrix.built-on }} on windows-latest (${{ matrix.group }})
    needs: apps-build
    runs-on: windows-latest
    # upstream releases change under us; the table in the job summary is the result
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        built-on: [ubuntu-latest, macos-14]
        group: [web, data, cli, docs-ui, cross]
        include:
          - group: web
            apps: django,flask,fastapi,datasette,wagtail,gradio
          - group: data
            apps: streamlit,jupyterlab,scrapy,locust
          - group: cli
            apps: httpie,black,ruff,yt-dlp,poetry,virtualenv,ansible
          - group: docs-ui
            apps: mkdocs-material,sphinx,textual,pygame,kivy
          - group: cross
            apps: zig-cross
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: apps-${{ matrix.built-on }}-${{ matrix.group }}
          path: apps-out
      - name: run
        shell: pwsh
        run: |
          python tools/apps_matrix.py --apps ${{ matrix.apps }} --run-from apps-out --jobs 2 --built-on "${{ matrix.built-on }}" --out apps.md --json apps.json
          $code = $LASTEXITCODE
          Get-Content apps.md | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apps-result-${{ matrix.built-on }}-${{ matrix.group }}
          path: apps.*

  bench:
    name: benchmark vs PyInstaller (${{ matrix.project }}, windows-latest)
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        project: [hello, level1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python tools/bench.py --project ${{ matrix.project }} --runs 7 --pyinstaller --json bench-${{ matrix.project }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.project }}
          path: bench-${{ matrix.project }}.json
