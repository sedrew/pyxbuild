[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golden-level1"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "Pillow",
    "requests",
    "certifi",
    "lxml",
    "cryptography",
    "pydantic",
]

[project.scripts]
level1 = "level1.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/level1"]
