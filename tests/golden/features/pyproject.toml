[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "features"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["featdata"]

[project.scripts]
features = "features.main:run"

[project.gui-scripts]
features-gui = "features.main:gui"

[tool.uv.sources]
featdata = { path = "packages/featdata" }

[tool.pyxbuild]
exclude = ["*.pyi"]
require = ["features/data/*.txt", "featdata/data/*.yaml"]
utf8-mode = true
icon = "app.ico"

[tool.pyxbuild.env]
FEATURES_DATA = "{data_dir}"

[tool.pyxbuild.version-info]
company-name = "pyxbuild tests"
copyright = "(c) 2026"
